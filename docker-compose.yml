version: '3'
# Settings and configurations that are common for all containers
services:
  mysql:
    image: 'mysql:8.0'
    container_name: "webhook-mysql"
    command: mysqld --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: '3Uh6jScdSJ'
      MYSQL_DATABASE: 'webhook'
    restart: 'always'
    volumes:
      - "./runtime/deploy/data/mysql:/var/lib/mysql"
    ports:
      - "23306:3306"
  redis:
    image: redis
    container_name: "webhook-redis"
    restart: 'always'
    volumes:
      - "./runtime/deploy/data/redis:/data"
      - "./runtime/deploy/logs/redis:/logs"
    ports:
      - "23679:6379"
